{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-stack">
            {% for category, message in messages %}
                <div class="flash {{ category }} {% if category in ['success', 'info'] %}alert-success{% elif category in ['danger', 'error'] %}alert-error{% endif %}" data-flash>{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
